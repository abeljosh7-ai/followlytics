<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followlytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #100d1c;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
        }

        h1 {
            font-size: 55px;
            color: #b58aff;
            margin: 20px 0;
        }

        p {
            color: #c4bdd4;
            font-size: 18px;
            line-height: 1.7;
            margin: 20px 0 30px;
        }

        .tagline {
            color: #a78bfa;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: bold;
        }

        .start-btn {
            display: inline-block;
            background: linear-gradient(90deg, #9333ea, #6366f1);
            padding: 15px 35px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 55px;">📊</div>
        <h1>Followlytics</h1>
        <div class="tagline">TRACK • ANALYSE • GROW</div>
        <p>
            Discover who follows you, who doesn't follow
            you back, and understand your Instagram
            connections with Followlytics.
        </p>
        <a href="/upload" class="start-btn">Get Started →</a>
    </div>
</body>
</html>
